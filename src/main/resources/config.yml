web:
  # HTTP port (internal/API access)
  port: 8080
  # MOTD (leave blank to use server.properties value; supports & color codes)
  motd: ""

  # HTTPS settings
  https:
    enabled: false
    port: 8443

    # ── ACME (Let's Encrypt auto-issuance) ─────────────────────
    acme:
      enabled: false
      domain: "mc.example.com"      # Domain to issue a certificate for
      email: "admin@example.com"    # Let's Encrypt account email
      # HTTP-01 challenge port (must be reachable externally on port 80)
      # Oracle: NSG + iptables 80/TCP must be allowed
      challenge-port: 80

    # ── Manual certificate (used when ACME is disabled) ─────────
    # certbot paths:
    #   cert: "/etc/letsencrypt/live/domain/fullchain.pem"
    #   key:  "/etc/letsencrypt/live/domain/privkey.pem"
    cert: ""
    key: ""

  # Public base URL used for /dashboard login link (no trailing slash)
  # e.g. "https://mc.example.com:8443" or "http://1.2.3.4:8080"
  # Leave blank to default to http://localhost:<port>
  public-url: ""

  # API authentication token (change this!)
  token: "changeme-please"

# ── Database ─────────────────────────────────────────────────────────────────
database:
  type: postgres   # sqlite | mysql | postgres
  # MySQL / PostgreSQL (ignored when type is sqlite):
  host: localhost
  port: 5432       # MySQL: 3306 / PostgreSQL: 5432
  database: serverdashboard
  username: postgres
  password: ""

# ── Chat channel system (VentureChat-style) ──────────────────────────────────
chat:
  enabled: true
  # Message format variables: {color} {alias} {player} {message}
  format: "{color}[{name}] §7{player}§f: {message}"
  pm-send-format:    "§d[귓속말 → {to}] §f{message}"
  pm-receive-format: "§d[귓속말 ← {from}] §f{message}"
  channels:
    global:
      name: "글로벌"
      alias: "g"
      color: "§f"
      distance: 0
      permission: ""
      default: true
    local:
      name: "로컬"
      alias: "l"
      color: "§7"
      distance: 200
      permission: ""
      default: false
    staff:
      name: "스태프"
      alias: "s"
      color: "§c"
      distance: 0
      permission: "serverdashboard.admin"
      default: false
